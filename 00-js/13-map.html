<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Map</title>
</head>
<body>
<script type="text/javascript">
    //大多数Map的特性都可以通过Object来实现
    let map = new Map();
    map.set("key1", "value1").set("key2", "value2");
    console.log(map);

    console.log(map.get("key1"));

    //entries 迭代
    map.entries().forEach(entry => {
        console.log(entry);
    });

    let set = new Set();
    set.add("value1");
    set.add("value2");

    set.values().forEach(entry => {
        console.log(entry);
    })


</script>
</body>
</html>

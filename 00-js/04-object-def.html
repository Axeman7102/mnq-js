<script type="text/javascript">

    /*第一种定义对象的方式*/

    /*第二种定义对象的方式：对象字面量*/
    let person = {
        name: "John",
        age: 9,
        job: "Software Engineer",
        sayName() {
            console.log(this.name);
        }
    };

    person.sayName();
    //数据属性和访问属性，参考图片note

    console.log("========================数据属性和访问属性==========================");
    let foo = {};
    Object.defineProperty(foo, "name", {value: "hello earth!", writable: false});
    console.log(foo.name);//earth
    foo.name = "hello world!";
    console.log(foo.name);//writable 为false,输出还是earth.

    //访问器属性用于精细控制

    let book = {
        year_: 2023,
        edition: 1
    };

    Object.defineProperty(book, "year_", {
        get() {
            return this.year_;
        },
        set(newValue) {
            if (newValue > this.year_) {
                this.year_ = newValue;
                this.edition += newValue - 2023;
            }
        }
    });

    book.year = 2024;
    console.log(book.edition);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>定义对象</title>
</head>
<body>
<script type="text/javascript">

    /*第一种定义对象的方式*/
    // let person = new Object();
    // person.name = "Alice";
    // person.age = 6;
    // person.job = "Software Engineer";
    //
    // person.sayName = function () {
    //     console.log(this.name);
    // }

    // person.sayName();

    /*第二种定义对象的方式：对象字面量*/
    let person = {
        name: "John",
        age: 9,
        job: "Software Engineer",
        sayName() {
            console.log(this.name);
        }
    };

    person.sayName();
    //数据属性和访问属性，参考图片note

    console.log("========================数据属性和访问属性==========================");
    let foo = {};
    Object.defineProperty(foo, "name", {value: "hello earth!", writable: false});
    console.log(foo.name);//earth
    foo.name = "hello world!";
    console.log(foo.name);//writable 为false,输出还是earth.

    //访问器属性用于精细控制

    let book = {
        year_: 2023,
        edition: 1
    };

    Object.defineProperty(book, "year", {
        get() {
            return this.year_;
        },
        set(newValue) {
            if (newValue > this.year_) {
                this.year_ = newValue;
                this.edition += newValue - 2023;
            }
        }
    });

    book.year = 2024;
    console.log(book.edition);

    console.log("======================连缀属性============================");

    let person1 = {
        name: "John",
        address: {
            street: "John",
            city: "He nan",
        }
    };

    console.log(person1.address.city);
    //如果address为空，会报typeErr，检查链中的对象的存在性，代码会变得十分冗杂，可以使用可选连缀操作符
    //这样如果中间对象不存在会返回undefined或者null
    console.log(person1.address?.city?.length);

    console.log("======================增强对象语法============================");
    //1.属性值简写,属性名和变量名一致
    let name = "john";
    let p = {
        name: name
    };
    console.log(p.name);
    //可以简写为
    let p1 = {name};
    console.log(p1.name);

    console.log("======================简写方法名============================");

    let person2 = {
        name: "John",
        age: 9,
        job: "Software Engineer",
        sayName: function () {
            console.log(this.name);
        }
    };

    //正常对象中定义方法，用属性名接上一个匿名函数,简写就采用上面开头的写法



</script>
</body>
</html>

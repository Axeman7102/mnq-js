<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ES类</title>
</head>
<body>
<script type="text/javascript">

    //类的两种定义方式：类声明、类表达式
    //类声明
    class Animal {
        //构造函数不是必须的，不定义相当于空构造函数
        constructor() {
        }
    }

    //类表达式
    let AnimalD = class {
    };

    //使用new 调用类名，相当于使用new调用constructor构造函数
    // 使用new调用类的构造函数会执行如下操作。
    // (1)在内存中创建一个新对象。
    // (2)这个新对象内部的 [[Prototype]] 指针被赋值为构造函数的prototype属性.
    // (3)构造函数内部的this被赋值为这个新对象（即this指向新对象）。
    // (4)执行构造函数内部的代码（给新对象添加属性）。
    // (5)如果构造函数返回非空对象，则返回该对象；否则，返回刚创建的新对象。
    let animal = new Animal();
    console.log("Animal.prototype", Animal.prototype);

    //一个典型的类定义
    class Person {
        //实例可以在类中快捷定义
        name;
        age;
        #address;//私有成员

        getAddress() {
            return this.#address;
        }

        //构造函数,实例字段也可以在构造函数中通过this定义
        constructor(name, age) {
            this.name = name;
            this.age = age;
            this.#address = "固定的地址";
        }

        //类中定义的方法为实例间共享的方法(类的原型上)
        // sayHello = function () {//这种写法是给了一个函数类型的实例属性,不对
        //     console.log("Hello World!");
        // }
        //定义在类原型上的成员
        sayHello() {
            console.log("prototype Hello World!");
        }

        //静态成员，属于类，在静态方法中，this指向类本身

        static foo = 100;

        static sayHello() {
            console.log("static Hello World!");
        }
    }

    let person1 = new Person("foo", 10);

    let person2 = new Person("bar", 20);
    console.log(person1.name, person1.age);
    console.log(person1.sayHello === person2.sayHello);

    console.log(person1["#address"]);//undefined
    console.log(person1.getAddress());

    Person.sayHello();//static say hello world.

</script>
</body>
</html>

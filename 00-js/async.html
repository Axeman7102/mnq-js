<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script type="text/javascript">

    /*
    * 一个Promise代表一个未来的值，有三种状态:
    * 1.pending 初始化，待执行状态;
    * 2.fulfilled 已成功，表明异步任务按照预期执行了，配套带一个value，代表最终的结果值。
    * 3.rejected 已失败，表明发生异常等异步任务没有按照预期去执行或拿到预期的结果，配套带一个reason，代表失败的原因。
    *
    * 构造函数接收resolve和reject两个函数，分别代表着把Promise置为成功或者失败，注意这个操作是幂等的，意味着从pending置成一个状态后，不能再变成其他状态。
    *
    * resolve(value) 中参数可以带上述value
    * reject(reason) 中参数可以带上述reason
    *
    * 另外一层理解：将耗时的操作放入到Promise的构造中，在耗时操作完成后，调用resolve或者reject来通知外部then或者catch的回调
    * */
    const p = new Promise((resolve, reject) => {
        setTimeout(() => {
            resolve(5)
        }, 1000)
    })

    p.then((value) => {
        console.log(value)//5
    })

    /*
    * then / catch / finally
    *
    * then 总是返回一个新的 Promise，这是链式调用的根基，注意 then的参数有两个 then(onFulfilled,onReject),其中两个函数分别
    * 对应成功或者失败的回调,参数分别对应Promise定义中的异步任务调用resolve和reject时的参数，注意catch(onReject) 其实是另外一种reject回调的写法
    *
    * catch(fn) 等价于 then(undefined, fn)
    *
    * finally 不接收参数，也不改变链的值，一般意义上的finally处理
    *
    * 根据上面讲的，then的参数是两个回调参数，但是实际上一次执行只会调用一个回调函数（对应Promise的幂等回调），then执行完之后，返回的新的Promise
    * 取决于回调函数中的返回值，注意：在then的回调函数中返回的Promise是有一个具体的状态的，具体规则：
    * 1.return 普通值，状态为fulfilled，值为该值（值穿透）
    * 2.return 另一个 Promise，下游“跟随”这个 Promise 的状态
    * 3.throw 错误，状态rejected，reason的值为为该错误
    * 4.什么都不 return（即 `undefined`），状态为fulfilled，值为 'undefined'
    * */

    const errPromise = new Promise((resolve, reject) => {
        setTimeout(() => {
            reject("发生了异常")
        }, 1000)
    })

    errPromise.then((value) => {
        console.log(`异步任务执行成功，结果: ${value}`)
    }).catch((err) => {
        console.log(`异步任务执行失败，原因: ${err}`)
    })

    //模拟几个返回场景
    const fPromise = new Promise((resolve, reject) => {
        setTimeout(() => {
            resolve(1)
        }, 1000)
    })

    fPromise.then((value) => {
        console.log('fPromise', value)
        return 100
    }).then((value) => {
        console.log('fPromise', value)//这个value，是上个then生成的Promise 执行后的值 100
        return Promise.resolve(200)//这个回调中返回一个指定的Promise，这个Promise就是调用then后会生成的Promise
    }).then(value => {
        console.log('fPromise', value)//200,这个回调中，不返回值，则生成的Promise fulfilled 值为 'undefined'
    }).then(value => {
        console.log('fPromise', value)//undefined
        throw Error("like you!")
    }).catch((err) => {
        console.log('fPromise', err)//"like you!"
    })

    /*
    * 上面使用then的链式调用中，能够顺利往下执行，有一个核心的原则：如果 then 没有提供对应状态的处理器，
    * 新 Promise 就原样继承上游的状态和值，这就是状态穿透，then中的两个回调的函数，其实就是针对两种状态
    * 的处理回调，如果上一个状态没能够得到处理，会顺序传递到下面，这也是为什么catch在最后，也能成功使用
    * 回调函数处理异常。
    * */

    /*
    * async+await的Promise语法糖：
    * async 函数永远返回 Promise。return 1 等价于 return Promise.resolve(1)；内部抛错等价于返回被 reject 的 Promise。
    * await 只能在 async 函数体内使用（ES Module 支持顶层 await，CommonJS 不行）。
    * await 会暂停当前 async 函数，但不阻塞主线程。函数执行到 await 时交出控制权，Promise settled 后剩余代码作为微任务恢复执行。
    *
    * 每个 await 都是一个断点，断点后面的代码会被挂到对应 Promise 的后续处理里,这样使用await书写的代码就能对应到上面的then链式的形式上
    * 这意味着await有两层处理(使用await的作用就是将其后的代码包装成一个Promise)：
    * await 右边的值如果不是 Promise，会被 Promise.resolve() 包装；注意下面的例子api返回的是一个Promise类型的对象
    * await 后面的代码会被包装成这个 Promise 的 .then 回调，也就是微任务。
    * */

    //api定义为返回一个间隔一定事件输出任务名的Promise，可通过参数控制Promise最终的成功或失败
    const api = (name, ms, fail = false) => {
        return new Promise((resolve, reject) => {
            setTimeout(() => {
                (fail ? reject(new Error(`${name} 挂了`)) : resolve(`${name}:${ms}`))
            }, ms)
        })
    }

    async function fetchInfo() {
        const a = await api("A", 2000)
        const b = await api("B", 3000)
        return {a, b}
    }

    fetchInfo().then(res => {
        console.log(res)//会等待五秒后返回一个对象 {a: 'A:2000', b: 'B:3000'}
    })

    //一些组合的场景，Promise.all(iterable),方法接收一个可迭代的参数，
    // 核心：通常是数组，元素如果是Promise，不进行转换，元素如果不是Promise,值会被当作 Promise.resolve(value) 处理，
    // 直接出现在结果数组中。注意以上，再需要进行Promise转换的时候，then、await也是同样的转换道理。
    // 语义：所有 Promise 都 fulfilled → （注意）返回值也是一个Promise，value为：resolve 结果数组；任一 rejected → 立即 reject（第一个错误），注意，reject之后，其他的
    // Promise仍然会执行，只是结果不会再被接收了，也不会处理。

    const pAll = Promise.all([api("A", 2000), api("B", 3000)])
    pAll.then(res => console.log(res))//由于是并发的,三秒可完成



</script>
</body>
</html>
